 "Replace Zone":["แยกให้ออกว่างานไหนในอาชีพที่ AI ทำแทนได้ แล้วเลิกแข่งตรงนั้น","ขยับไปเป็นคนคุม ตรวจ หรือออกแบบ workflow ของ AI","มองหาอาชีพข้างเคียงที่ใช้สกิลเดิม แต่อยู่สูงกว่าในแกน Human Premium"],
 "Untouched":["งานนี้ AI ยังไม่แตะ แต่ควรระวังระบบอัตโนมัติและหุ่นยนต์","เพิ่มทักษะบริการหรือความเชี่ยวชาญเฉพาะ เพื่อขยับขึ้นในแกน Human Premium","ใช้ AI ช่วยงานหลังบ้าน เช่น จัดตาราง ตอบแชตลูกค้า ทำบัญชีร้าน"]
};

const DEFAULT_INFO='คลิกอาชีพไหนก็ได้เพื่อดูวิธีพัฒนา · อาชีพที่มีขอบดำจะแตกเป็นงานย่อย · คลิกพื้นที่ว่างเพื่อวางจุด "คุณ"';

// ===== CHART SETUP =====
const W=900,H=640,M={l:64,r:24,t:24,b:56};
const PW=W-M.l-M.r, PH=H-M.t-M.b;
const sx=v=>M.l+v/100*PW, sy=v=>M.t+(1-v/100)*PH;
const svg=document.getElementById('chart'), NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
const quad=(x,y)=>y>=50?(x<50?"Human Core":"Superpowered"):(x<50?"Untouched":"Replace Zone");

// legend
document.getElementById('legend').innerHTML=Object.values(CAT).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');

// quadrants
const bg=el('g',{});
[[M.l,M.t,'#e3eed5'],[sx(50),M.t,'#dfe5f1'],[M.l,sy(50),'#efe8da'],[sx(50),sy(50),'#f2ddd7']]
 .forEach(([x,y,f])=>el('rect',{x,y,width:PW/2,height:PH/2,fill:f},bg));
[["HUMAN CORE","AI แตะได้น้อย คนยังอยากได้มนุษย์",M.l+12,M.t+26,"start","#4a7a2c"],
 ["SUPERPOWERED","AI ทำได้เยอะ แต่ยังต้องมีคนคุม",W-M.r-12,M.t+26,"end","#3b5b92"],
 ["UNTOUCHED","AI ยังไม่มา แต่หุ่นยนต์อาจมาแทน",M.l+12,H-M.b-28,"start","#8a6d3b"],
 ["REPLACE ZONE","AI ทำได้ และคนไม่สนว่าใครทำ",W-M.r-12,H-M.b-28,"end","#b5442f"]]
 .forEach(([t,s,x,y,a,c])=>{
   el('text',{x,y,'text-anchor':a,fill:c,'font-size':17,'font-weight':800},bg).textContent=t;
   el('text',{x,y:y+16,'text-anchor':a,fill:c,'font-size':11,opacity:.85},bg).textContent=s;
 });
el('line',{x1:sx(50),x2:sx(50),y1:M.t,y2:H-M.b,stroke:'#999','stroke-dasharray':'4 4'},bg);
el('line',{x1:M.l,x2:W-M.r,y1:sy(50),y2:sy(50),stroke:'#999','stroke-dasharray':'4 4'},bg);
[0,25,50,75,100].forEach(v=>{
  el('text',{x:sx(v),y:H-M.b+18,'text-anchor':'middle','font-size':11,fill:'#666'},bg).textContent=v+'%';
  el('text',{x:M.l-8,y:sy(v)+4,'text-anchor':'end','font-size':11,fill:'#666'},bg).textContent=v;
});
el('text',{x:M.l+PW/2,y:H-12,'text-anchor':'middle','font-size':13,'font-weight':700},bg).textContent='AI Exposure · สัดส่วนงานที่ AI ทำได้ →';
el('text',{'text-anchor':'middle','font-size':13,'font-weight':700,transform:`translate(20,${M.t+PH/2}) rotate(-90)`},bg).textContent='Human Premium · คนยังอยากจ้างมนุษย์แค่ไหน →';

const gTrail=el('g',{}), gPts=el('g',{}), gSub=el('g',{}), gMe=el('g',{});
const tip=document.getElementById('tip'), info=document.getElementById('info'), panel=document.getElementById('panel');
info.textContent=DEFAULT_INFO;

// ===== POINTS =====
const nodes=JOBS.map(([en,th,cat,x23,x30,y])=>{
  const c=CAT[cat][1];
  const trail=el('line',{stroke:c,'stroke-width':2,opacity:.3},gTrail);
  const g=el('g',{class:'pt'},gPts);
  const dot=el('circle',{r:6.5,fill:c,stroke:SUBS[en]?'#111':'#fff','stroke-width':SUBS[en]?2:1.5},g);
  const lb=el('text',{class:'lbl'},g); lb.textContent=en;
  const n={en,th,x23,x30,y,c,g,dot,lb,trail,x:x23};
  g.addEventListener('mouseenter',e=>showTip(e,n));
  g.addEventListener('mousemove',moveTip);
  g.addEventListener('mouseleave',()=>tip.style.opacity=0);
  g.addEventListener('click',e=>{e.stopPropagation();toggle(n);});
  return n;
});

let year=2023, open=null, hlIndex=null;
function update(){
  const t=(year-2023)/7;
  nodes.forEach(n=>{
    n.x=n.x23+(n.x30-n.x23)*t;
    const cx=sx(n.x), cy=sy(n.y);
    n.dot.setAttribute('cx',cx); n.dot.setAttribute('cy',cy);
    n.lb.setAttribute('x',cx+9); n.lb.setAttribute('y',cy+3.5);
    Object.entries({x1:sx(n.x23),y1:cy,x2:cx,y2:cy}).forEach(([k,v])=>n.trail.setAttribute(k,v));
  });
  drawSubs();
}

function toggle(n){
  open = open===n ? null : n;
  hlIndex=null;
  nodes.forEach(m=>m.g.style.opacity = open && m!==open ? .12 : 1);
  gTrail.style.opacity = open ? .15 : 1;
  drawSubs();
  if(open) setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

// ===== วาดงานย่อย + การ์ดคำแนะนำ =====
function drawSubs(){
  gSub.innerHTML=''; panel.innerHTML='';
  if(!open){info.textContent=DEFAULT_INFO;return;}

  const subs=SUBS[open.en];
  const jobZone=quad(open.x,open.y), JZ=ZONE[jobZone];

  // อาชีพที่ยังไม่มีงานย่อย → คำแนะนำทั่วไปตามโซน
  if(!subs){
    info.innerHTML=`<b>${open.th}</b> อยู่ในโซน <b style="color:${JZ.c}">${jobZone}</b> (ปี ${Math.floor(year)}) · แนวทาง: <b>${JZ.act}</b> · คลิกอีกครั้งเพื่อปิด`;
    panel.innerHTML=`
      <div class="ph">ควรพัฒนาตัวเองยังไง ถ้าเป็น${open.th}<small>${JZ.why}</small></div>
      <div class="card" style="--c:${JZ.c}">
        <span class="badge">${JZ.act}</span><span class="zone">${jobZone}</span>
        <h3>แนวทางทั่วไป</h3>
        <ol>${GENERAL[jobZone].map(s=>`<li>${s}</li>`).join('')}</ol>
        <div class="meta">ยังไม่มีข้อมูลงานย่อยของอาชีพนี้ เพิ่มได้ใน SUBS เพื่อให้มีคำแนะนำรายสกิล</div>
      </div>`;
    return;
  }

  // อาชีพที่มีงานย่อย → plot บนกราฟ
  const px=sx(open.x), py=sy(open.y), rings=[];
  subs.forEach((s,i)=>{
    const cx=sx(s.x), cy=sy(s.y), zc=ZONE[quad(s.x,s.y)].c;
    el('line',{x1:px,y1:py,x2:cx,y2:cy,stroke:open.c,'stroke-dasharray':'3 3','stroke-width':1.5},gSub);
    rings[i]=el('circle',{cx,cy,r:14,fill:'none',stroke:zc,'stroke-width':3,opacity:hlIndex===i?1:0},gSub);
    const d=el('rect',{class:'subdot',x:cx-6,y:cy-6,width:12,height:12,fill:open.c,stroke:'#fff','stroke-width':1.5,transform:`rotate(45 ${cx} ${cy})`},gSub);
    d.addEventListener('click',e=>{e.stopPropagation();highlight(i,true);});
    el('text',{x:cx+12,y:cy+4,'font-size':12,'font-weight':700,fill:'#222','pointer-events':'none'},gSub).textContent=s.n;
  });

  const replaced=subs.filter(s=>quad(s.x,s.y)==="Replace Zone").length;
  const human=subs.filter(s=>s.y>=50).length;
  info.innerHTML=`<b>${open.th}</b> ไม่ได้หายไปทั้งอาชีพ — งานย่อย ${replaced} จาก ${subs.length} อย่างอยู่ใน Replace Zone แต่อีก ${human} อย่างยังเป็นงานที่คนอยากได้มนุษย์ทำ · ดูวิธีพัฒนาแต่ละสกิลด้านล่าง (คลิกอีกครั้งเพื่อปิด)`;

  // การ์ด เรียงตามลำดับความสำคัญของโซน
  panel.innerHTML=`<div class="ph">ควรพัฒนาสกิลไหนก่อน ถ้าเป็น${open.th}<small>เรียงจากสกิลที่ควรลงทุนเพิ่ม ไปจนถึงสกิลที่ควรส่งให้ AI ทำ</small></div>`;
  subs.map((s,i)=>({s,i,z:quad(s.x,s.y)}))
      .sort((a,b)=>ZONE_ORDER.indexOf(a.z)-ZONE_ORDER.indexOf(b.z))
      .forEach(({s,i,z})=>{
        const Z=ZONE[z];
        const card=document.createElement('div');
        card.className='card'+(hlIndex===i?' hl':'');
        card.id='card'+i;
        card.style.setProperty('--c',Z.c);
        card.innerHTML=`
          <span class="badge">${Z.act}</span><span class="zone">${z}</span>
          <h3>${s.n}</h3>
          <div><b>พัฒนายังไง:</b> ${s.how}</div>
          <div class="step"><b>เริ่มได้เลย:</b> ${s.start}</div>
          <div class="meta">AI ทำได้ ${s.x}% · Human Premium ${s.y} · ${Z.why}</div>`;
        card.addEventListener('mouseenter',()=>rings[i].setAttribute('opacity',1));
        card.addEventListener('mouseleave',()=>{ if(hlIndex!==i) rings[i].setAttribute('opacity',0); });
        panel.appendChild(card);
      });
}

function highlight(i,scroll){
  hlIndex=i;
  drawSubs();
  const c=document.getElementById('card'+i);
  if(c && scroll) c.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function showTip(e,n){
  tip.innerHTML=`<b>${n.th}</b> (${n.en})<br>AI ทำได้: ${Math.round(n.x)}% (ปี ${Math.floor(year)})<br>Human Premium: ${n.y}<br>โซน: <b>${quad(n.x,n.y)}</b><br><i>${SUBS[n.en]?'คลิกเพื่อแตกเป็นงานย่อยและดูวิธีพัฒนา':'คลิกเพื่อดูวิธีพัฒนา'}</i>`;
  tip.style.opacity=1; moveTip(e);
}
function moveTip(e){tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';}

// วางจุด "คุณ"
svg.addEventListener('click',e=>{
  if(open){toggle(open);return;}
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  if(p.x<M.l||p.x>W-M.r||p.y<M.t||p.y>H-M.b) return;
  gMe.innerHTML='';
  el('circle',{cx:p.x,cy:p.y,r:10,fill:'none',stroke:'#e4572e','stroke-width':3},gMe);
  el('circle',{cx:p.x,cy:p.y,r:3,fill:'#e4572e'},gMe);
  el('text',{x:p.x+14,y:p.y+5,'font-size':14,'font-weight':800,fill:'#e4572e'},gMe).textContent='คุณ';
});

// slider + play
const yr=document.getElementById('year'), yl=document.getElementById('yearLabel');
yr.oninput=()=>{year=+yr.value; yl.textContent=Math.floor(year); update();};
document.getElementById('play').onclick=()=>{
  let v=2023; const id=setInterval(()=>{v+=0.04; if(v>=2030){v=2030;clearInterval(id);} yr.value=v; yr.oninput();},30);
};

// ===== หัวข้อเปลี่ยนชื่ออาชีพ =====
const jobEl=document.getElementById('job'),
      artEl=document.getElementById('article'),
      thEl=document.getElementById('jobTh'),
      headline=document.getElementById('headline');
const order=nodes.map((_,i)=>i).sort(()=>Math.random()-.5); // สุ่มลำดับ
const getArticle=w=>/^[AEIOU]/i.test(w)?'an':'a';           // a / an อัตโนมัติ
let ji=0, current=null, paused=false;

function showJob(){
  if(paused) return;
  const n=nodes[order[ji]];
  jobEl.classList.add('out');
  setTimeout(()=>{
    jobEl.textContent=n.en;
    artEl.textContent=getArticle(n.en);
    jobEl.style.color=n.c;
    thEl.textContent='→ '+n.th+' · คลิกชื่ออาชีพเพื่อดูวิธีพัฒนา';
    jobEl.classList.remove('out');
    if(current) current.dot.setAttribute('r',6.5);   // คืนขนาดจุดเดิม
    if(!open) n.dot.setAttribute('r',11);            // ขยายจุดในกราฟ
    current=n;
  },300);
  ji=(ji+1)%order.length;
}

headline.addEventListener('mouseenter',()=>paused=true);
headline.addEventListener('mouseleave',()=>paused=false);
jobEl.addEventListener('click',()=>{ if(current) toggle(current); });

showJob();
setInterval(showJob,2000); // เปลี่ยนทุก 2 วินาที

update();
</script>
</body>
</html>
